<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | GunaLeather Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..900&family=Montserrat:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body.login-body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            color: #e0e0e0;
            padding: 2rem 0;
        }

        .login-card {
            background: #141414;
            padding: 3rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(184, 134, 11, 0.1);
            text-align: center;
        }

        .login-card h1 {
            font-family: 'Playfair Display', serif;
            color: #B8860B;
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
        }

        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            color: #777;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 0;
            transition: color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-tab.active {
            color: #B8860B;
            border-bottom: 2px solid #B8860B;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .login-form label {
            display: block;
            margin-bottom: 0.5rem;
            color: #B8860B;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-form input {
            width: 100%;
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 1rem;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            transition: border-color 0.3s;
        }

        .login-form input:focus {
            outline: none;
            border-color: #B8860B;
        }

        .btn-auth {
            width: 100%;
            background: #B8860B;
            color: black;
            border: none;
            padding: 1rem;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-auth:hover {
            background: #cca33d;
            transform: translateY(-2px);
        }

        .error-message {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }

        .success-message {
            color: #4CAF50;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }

        .back-link {
            display: block;
            margin-top: 2rem;
            color: #777;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #B8860B;
        }
    </style>
</head>

<body class="login-body">
    <div class="login-card">
        <h1>Admin Portal</h1>

        <div class="auth-tabs">
            <button id="tab-login" class="auth-tab active">Login</button>
            <button id="tab-register" class="auth-tab">Register</button>
        </div>

        <form id="loginForm" class="login-form auth-form active">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required aria-label="Username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required aria-label="Password">
            </div>
            <div id="loginError" class="error-message">Invalid username or password</div>
            <button type="submit" class="btn-auth">SIGN IN</button>
        </form>

        <form id="registerForm" class="login-form auth-form">
            <div class="form-group">
                <label for="reg-username">Username</label>
                <input type="text" id="reg-username" required aria-label="New Username">
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" required aria-label="New Password">
            </div>
            <div id="regError" class="error-message">Username already exists</div>
            <div id="regSuccess" class="success-message">Registration successful! You can now login.</div>
            <button type="submit" class="btn-auth">REGISTER</button>
        </form>

        <a href="index.html" class="back-link">Return to Storefront</a>
    </div>

    <script>
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const formLogin = document.getElementById('loginForm');
        const formRegister = document.getElementById('registerForm');

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            formLogin.classList.add('active');
            formRegister.classList.remove('active');
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            formRegister.classList.add('active');
            formLogin.classList.remove('active');
        });

        // Login Logic
        formLogin.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('loginError');

            // Clear previous error message
            errorMsg.style.display = 'none';

            const admins = JSON.parse(localStorage.getItem('guna_admins') || '[]');
            const admin = admins.find(a => a.username === user && a.password === pass);

            // Resilient check: Super admin or registered admin
            if ((admins.length === 0 && user === 'admin' && pass === 'admin') || admin) {
                sessionStorage.setItem('guna_admin_logged_in', 'true');
                window.location.href = 'admin.html';
            } else {
                errorMsg.style.display = 'block';
            }
        });

        // Registration Logic
        formRegister.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('reg-username').value;
            const pass = document.getElementById('reg-password').value;
            const errorMsg = document.getElementById('regError');
            const successMsg = document.getElementById('regSuccess');

            let admins = JSON.parse(localStorage.getItem('guna_admins') || '[]');

            if (admins.find(a => a.username === user)) {
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
                return;
            }

            admins.push({ username: user, password: pass });
            localStorage.setItem('guna_admins', JSON.stringify(admins));

            errorMsg.style.display = 'none';
            successMsg.style.display = 'block';
            formRegister.reset();

            // Switch to login tab after brief delay
            setTimeout(() => {
                tabLogin.click();
            }, 1500);
        });

        // If already logged in, redirect to admin
        if (sessionStorage.getItem('guna_admin_logged_in') === 'true') {
            window.location.href = 'admin.html';
        }
    </script>
</body>

</html>
