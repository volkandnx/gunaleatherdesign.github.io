<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | GunaLeather Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..900&family=Montserrat:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        // Auth Guard
        if (sessionStorage.getItem('guna_admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }

        function logout() {
            sessionStorage.removeItem('guna_admin_logged_in');
            window.location.href = 'login.html';
        }
    </script>
    <style>
        :root {
            --admin-bg: #1a1a1a;
            --admin-card: #242424;
            --admin-accent: #B8860B;
            --admin-text: #e0e0e0;
        }

        body.admin-body {
            background-color: var(--admin-bg);
            color: var(--admin-text);
            font-family: 'Montserrat', sans-serif;
            padding: 2rem;
            margin: 0;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
        }

        .admin-header h1 {
            font-family: 'Playfair Display', serif;
            color: var(--admin-accent);
            margin: 0;
        }

        .btn-add {
            background: var(--admin-accent);
            color: black;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn-add:hover {
            transform: translateY(-2px);
        }

        .product-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--admin-card);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .product-table th,
        .product-table td {
            padding: 1.2rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-table th {
            background: rgba(0, 0, 0, 0.2);
            color: var(--admin-accent);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .product-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }

        .stock-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stock-input {
            width: 50px;
            background: #333;
            border: 1px solid #444;
            color: white;
            padding: 5px;
            text-align: center;
            border-radius: 4px;
        }

        .btn-action {
            background: none;
            border: 1px solid var(--admin-accent);
            color: var(--admin-accent);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-right: 5px;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: var(--admin-accent);
            color: black;
        }

        .btn-delete {
            border-color: #ff4d4d;
            color: #ff4d4d;
        }

        .btn-delete:hover {
            background: #ff4d4d;
            color: white;
            border-color: #ff4d4d;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--admin-card);
            padding: 2.5rem;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--admin-accent);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: #333;
            border: 1px solid #444;
            color: white;
            padding: 0.8rem;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .drop-zone {
            width: 100%;
            height: 150px;
            border: 2px dashed #444;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.02);
            color: #777;
            position: relative;
            overflow: hidden;
        }

        .drop-zone.dragover {
            border-color: var(--admin-accent);
            background: rgba(184, 134, 11, 0.1);
            color: var(--admin-accent);
        }

        .drop-zone img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        .drop-zone.has-image img {
            display: block;
        }

        .drop-zone.has-image .drop-zone-text {
            display: none;
        }

        .drop-zone-text {
            text-align: center;
            pointer-events: none;
        }

        .drop-zone-text svg {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            fill: currentColor;
        }
    </style>
</head>

<body class="admin-body">
    <div class="admin-container">
        <div class="admin-header">
            <h1>Product & Stock Control</h1>
            <div>
                <a href="index.html" class="btn-action">View Site</a>
                <button class="btn-action" onclick="logout()" style="border-color: #777; color: #777;">Logout</button>
                <button class="btn-add" onclick="openModal()">Add New Product</button>
            </div>
        </div>

        <table class="product-table">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Name (EN/TR)</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="product-list">
                <!-- Products will be loaded here -->
            </tbody>
        </table>
    </div>

    <!-- Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Product</h2>
            <form id="productForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Product Image</label>
                    <div id="dropZone" class="drop-zone">
                        <div class="drop-zone-text">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
                            </svg>
                            <p>Drag & Drop or Click to Upload</p>
                        </div>
                        <img id="imgPreview" src="" alt="Preview">
                        <input type="file" id="prodImageFile" accept="image/*" style="display: none;">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Name (English)</label>
                        <input type="text" id="prodNameEn" required>
                    </div>
                    <div class="form-group">
                        <label>Name (Turkish)</label>
                        <input type="text" id="prodNameTr" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description (English)</label>
                    <textarea id="prodDescEn" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Description (Turkish)</label>
                    <textarea id="prodDescTr" rows="2" required></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label>Initial Stock</label>
                        <input type="number" id="prodStock" value="10" required>
                    </div>
                    <div class="form-group">
                        <label>WhatsApp Link (e.g. +905...)</label>
                        <input type="text" id="prodWa" value="+905550453659">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-action" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-add">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
